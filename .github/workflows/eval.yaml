name: RAG Evaluation Suite

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  pull_request:
    paths:
      - 'application/**'
      - 'eval/**'
      
jobs:
  evaluate:
    # Pinned: Python 3.11 builds aren't published for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Application Dependencies
        run: pip install -r application/requirements_full.txt -r application/requirements.txt
          
      - name: Install Evaluation Dependencies
        run: pip install -r eval/requirements-eval.txt pyyaml
        
      - name: Run RAG Evaluation Suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python eval/run_eval_suite.py
          
      - name: Upload Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: eval/results/
          retention-days: 30
