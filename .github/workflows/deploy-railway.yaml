name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and deploy directly'
        required: false
        default: false
        type: boolean

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    # Pinned: Playwright 1.56 can't install browsers on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
        env:
          CI: true

  test-backend:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          pip install -r requirements_full.txt
          pip install --no-deps -r requirements.txt
          pip install -r requirements-dev.txt
        working-directory: application

      - name: Run pytest
        run: pytest -v
        working-directory: application

  # Deployment is handled by Railway's GitHub integration (it deploys main
  # automatically), so there is no deploy job here.
